[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-oscs"
version = "0.1.0"
description = "YOLO open-set cold-start segmentation research scaffold"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "ultralytics>=8.3",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["oscs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
